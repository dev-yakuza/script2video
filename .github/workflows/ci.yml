name: ci

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'tts-server/**'
      - 'aligner/**'
      - 'imagegen/**'
      - 'imagegen.lock.json'
      - 'ruff.toml'
      - 'videos/**'
      - 'models.lock.json'
      - 'fonts.lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tts-server/**'
      - 'aligner/**'
      - 'imagegen/**'
      - 'imagegen.lock.json'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ffmpeg (parts character composition tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @script2video/core build
      - run: yarn workspace @script2video/renderer-remotion build
      - run: yarn workspace @script2video/cli build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

  # End to end without models: render the sample from its locked audio (--frozen-audio).
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ffmpeg and headless Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 \
            libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64 libasound2t64
      - run: corepack enable
      - run: yarn install --immutable
      - id: remotion
        run: echo "version=$(node -p "require('@remotion/renderer/package.json').version")" >> "$GITHUB_OUTPUT"
      # the headless browser Remotion downloads (render and capture), one per renderer version
      - uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ steps.remotion.outputs.version }}
      - run: yarn build
      - run: node packages/cli/dist/main.js render videos/sample-ko/script.ko.md --output youtube --frozen-audio
      - run: node packages/cli/dist/main.js render videos/sample-ko/script.ko.md --output shorts --frozen-audio
      - run: test -s out/sample-ko/youtube.ko.mp4 && test -s out/sample-ko/youtube.ko.srt && test -s out/sample-ko/youtube.ko.thumbnail.png
      - name: proxy watermark (S13)
        run: |
          plain="youtube.ko.mp4 youtube.ko.srt youtube.ko.vtt youtube.ko.description.md youtube.ko.thumbnail.png"
          (cd out/sample-ko && sha256sum $plain > "$RUNNER_TEMP/plain.sha")
          node packages/cli/dist/main.js render videos/sample-ko/script.ko.md --output youtube --frozen-audio --watermark proxy
          (cd out/sample-ko && sha256sum -c "$RUNNER_TEMP/plain.sha")
          node scripts/check-band.mjs out/sample-ko/youtube.ko.proxy.mp4 out/sample-ko/youtube.ko.mp4 461:115:38:38 461:115:1459:927
          node scripts/check-band.mjs out/sample-ko/youtube.ko.proxy.thumbnail.png out/sample-ko/youtube.ko.thumbnail.png 307:77:26:26 307:77:973:643
      - name: scene pick (S11)
        run: |
          plain="youtube.ko.mp4 youtube.ko.srt youtube.ko.vtt youtube.ko.description.md youtube.ko.thumbnail.png"
          (cd out/sample-ko && sha256sum $plain > "$RUNNER_TEMP/plain-s11.sha")
          lock=videos/sample-ko/audio/ko/manifest.json
          sha256sum "$lock" > "$RUNNER_TEMP/lock.sha"
          before=$(stat -c %Y "$lock")
          clip="$RUNNER_TEMP/clip"
          node packages/cli/dist/main.js render videos/sample-ko/script.ko.md --output youtube --frozen-audio --scenes settings --out-dir "$clip"
          for f in mp4 srt vtt; do test -s "$clip/youtube.ko.scenes-settings.$f"; done
          for f in chapters.txt description.md thumbnail.png; do test ! -e "$clip/youtube.ko.scenes-settings.$f"; done
          test -z "$(ls out/sample-ko | grep scenes || true)"
          len() { ffprobe -v error -show_entries format=duration -of csv=p=0 "$1"; }
          awk -v a="$(len "$clip/youtube.ko.scenes-settings.mp4")" -v b="$(len out/sample-ko/youtube.ko.mp4)" 'BEGIN { exit !(a < b) }'
          (cd out/sample-ko && sha256sum -c "$RUNNER_TEMP/plain-s11.sha")
          sha256sum -c "$RUNNER_TEMP/lock.sha"
          test "$(stat -c %Y "$lock")" = "$before"
          # the full render, in its own work folder, is untouched by the pick
          node packages/cli/dist/main.js render videos/sample-ko/script.ko.md --output youtube --frozen-audio 2>&1 | tee "$RUNNER_TEMP/full.log"
          grep -q 'all scene chunks cached' "$RUNNER_TEMP/full.log"
      - name: snapshot stills (S6)
        run: |
          node packages/cli/dist/main.js snapshot videos/sample-ko/script.ko.md --output youtube --frozen-audio --frames --out-dir "$RUNNER_TEMP/stills"
          test -s "$RUNNER_TEMP/stills/youtube.ko.snapshot.png"
          node scripts/check-frames.mjs "$RUNNER_TEMP/stills/youtube.ko.frames" 2
      - name: capture in a real browser (S5)
        run: |
          # capture keeps the browser sandbox on: let it make its user namespace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          CAPTURE_E2E=1 yarn vitest run packages/cli/test/capture-e2e.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-render
          path: out/sample-ko/
          retention-days: 7

  # Static checks only: installing torch / MLX and the models is too heavy for CI.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uvx ruff@0.17.0 check .
      - run: uvx ruff@0.17.0 format --check .
      - run: python -m py_compile tts-server/server.py tts-server/helpers.py tts-server/train_speaker.py tts-server/scripts/*.py aligner/server.py aligner/pitch_helpers.py aligner/lifeline.py imagegen/*.py
      - run: python -m unittest discover -s tts-server -p 'test_*.py'
      - run: python -m unittest discover -s imagegen -p 'test_*.py'
      # the image steps with numpy / Pillow / scipy as imagegen/uv.lock pins them (uv cannot sync
      # that project on linux: MLX); derive's golden is tied to DERIVE_VERSION (S9b)
      - run: python scripts/check_imagegen_pins.py
      - run: uv run --no-project --python 3.12 --with numpy==2.5.4 --with pillow==12.3.0 --with scipy==1.18.1 python -m unittest discover -s imagegen -p 'test_*.py'
      - run: python -m unittest discover -s aligner -p 'test_*.py'
      - run: uv lock --check
        working-directory: tts-server
      - run: uv lock --check
        working-directory: aligner
      - run: uv lock --check
        working-directory: imagegen
